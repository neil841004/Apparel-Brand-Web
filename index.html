<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服飾網購整理</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #22222f;
    --border: #2e2e3f;
    --accent: #7c6af7;
    --accent2: #a78bfa;
    --text: #e8e8f0;
    --text2: #9090a8;
    --card-hover: #252535;
    --tag-bg: #2e2e3f;
    --star-color: #f5c542;
    --price1: #4ade80;
    --price2: #facc15;
    --price3: #f87171;
    --radius: 14px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border-bottom: 1px solid var(--border);
    padding: 32px 24px 28px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  .header-inner {
    max-width: 1440px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--accent), #ec4899);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  h1 span { color: var(--accent2); }

  .subtitle { color: var(--text2); font-size: 13px; margin-top: 2px; }

  .edit-link {
    margin-left: auto;
    padding: 7px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text2);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
    transition: border-color .2s, color .2s;
  }
  .edit-link:hover { border-color: var(--accent); color: var(--accent2); }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .filter-label {
    color: var(--text2);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    white-space: nowrap;
  }

  .filter-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
    white-space: nowrap;
    user-select: none;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .search-wrap {
    margin-left: auto;
    position: relative;
  }

  .search-wrap svg {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%);
    color: var(--text2);
    pointer-events: none;
  }

  #search {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 14px 7px 34px;
    font-size: 13px;
    width: 200px;
    outline: none;
    transition: border-color 0.2s, width 0.2s;
  }

  #search:focus { border-color: var(--accent); width: 240px; }
  #search::placeholder { color: var(--text2); }

  /* ── Stats bar ── */
  .stats-bar {
    max-width: 1440px;
    margin: 16px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .stats-count { font-size: 13px; color: var(--text2); }
  .stats-count span { color: var(--accent2); font-weight: 600; }

  /* ── Grid ── */
  main {
    max-width: 1440px;
    margin: 0 auto;
    padding: 20px 24px 60px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow), 0 0 0 1px var(--accent);
    border-color: var(--accent);
  }

  .card-thumb {
    height: 120px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .card-thumb img.favicon {
    width: 56px; height: 56px;
    border-radius: 12px;
    object-fit: contain;
    background: #fff;
    padding: 6px;
  }

  .card-thumb .brand-bg {
    position: absolute; inset: 0;
    opacity: 0.12;
    background-size: cover;
    background-position: center;
    filter: blur(8px) saturate(1.5);
  }

  .card-body {
    padding: 14px 16px 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card-name {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  /* Star rating */
  .stars {
    display: flex;
    gap: 2px;
  }

  .star {
    font-size: 13px;
    color: #3a3a4a;
  }
  .star.filled { color: var(--star-color); }

  /* Price badge */
  .price-badge {
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .price-1 { background: rgba(74, 222, 128, 0.15); color: var(--price1); border: 1px solid rgba(74,222,128,0.3); }
  .price-2 { background: rgba(250, 204, 21, 0.15); color: var(--price2); border: 1px solid rgba(250,204,21,0.3); }
  .price-3 { background: rgba(248, 113, 113, 0.15); color: var(--price3); border: 1px solid rgba(248,113,113,0.3); }
  .price-store { background: rgba(167, 139, 250, 0.15); color: var(--accent2); border: 1px solid rgba(167,139,250,0.3); }

  .category-tag {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--text2);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-top: 2px;
  }

  .visit-time {
    font-size: 11px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 16px;
  }
  .visit-time.has-visit { color: var(--accent2); }

  /* ── Section heading ── */
  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 32px 0 16px;
  }

  .section-header h2 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  .section-header .count-badge {
    background: var(--tag-bg);
    color: var(--text2);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
  }

  .section-divider {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Hidden */
  .card.hidden { display: none; }
  .section-block.hidden { display: none; }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--text2);
    display: none;
  }
  .empty-state.show { display: block; }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* ── Loading overlay ── */
  .loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .loading-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .loading-icon {
    font-size: 56px;
    animation: loadingBounce 1.2s ease-in-out infinite;
  }
  @keyframes loadingBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-12px) scale(1.08); }
  }
  .loading-text {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .loading-sub {
    font-size: 13px;
    color: var(--text2);
    margin-top: -16px;
  }
  .progress-bar-wrap {
    width: 260px;
    height: 6px;
    background: var(--surface2);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), #ec4899, var(--accent2));
    background-size: 200% 100%;
    animation: progressShimmer 1.5s ease-in-out infinite;
    transition: width 0.3s ease;
  }
  @keyframes progressShimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .loading-percent {
    font-size: 13px;
    color: var(--text2);
    font-variant-numeric: tabular-nums;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Collapsible filter (mobile) ── */
  .filter-toggle {
    display: none;
  }

  @media (max-width: 640px) {
    header { padding: 16px 16px 14px; }
    main { padding: 12px 16px 40px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    h1 { font-size: 20px; }

    /* Toggle button */
    .filter-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s;
    }
    .filter-toggle:hover { border-color: var(--accent); }
    .filter-toggle.has-filter { border-color: var(--accent); color: var(--accent2); }

    .filter-toggle-label { flex: 1; }

    .filter-active-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      display: none;
    }
    .filter-active-badge.show { display: inline-block; }

    .filter-toggle-arrow {
      font-size: 11px;
      color: var(--text2);
      transition: transform 0.25s;
    }
    .filter-toggle.open .filter-toggle-arrow { transform: rotate(180deg); }

    /* Collapsible container */
    .filter-collapse {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.3s ease, opacity 0.25s ease, margin-top 0.25s ease;
      margin-top: 0;
    }
    .filter-collapse.open {
      max-height: 600px;
      opacity: 1;
      margin-top: 10px;
    }

    /* Inside the collapse: stack groups vertically */
    .filter-bar {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }
    .filter-group {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .filter-label { margin-bottom: 2px; }
    .filter-group > div { display: flex; flex-wrap: wrap; gap: 6px; }

    .search-wrap { width: 100%; margin-left: 0; }
    #search { width: 100%; }
    #search:focus { width: 100%; }

    /* ── List layout ── */
    .grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      flex-direction: row;
      align-items: center;
      border-radius: 12px;
    }

    .card:hover { transform: translateX(3px) translateY(0); }

    .card-thumb {
      width: 64px;
      height: 64px;
      min-width: 64px;
      border-radius: 10px 0 0 10px;
      background: var(--surface2);
    }

    .card-thumb img.favicon {
      width: 36px;
      height: 36px;
    }

    .card-body {
      padding: 10px 12px;
      justify-content: center;
      gap: 5px;
    }

    .card-name {
      font-size: 14px;
    }

    .card-meta {
      justify-content: flex-start;
      gap: 8px;
    }

    .stars .star { font-size: 11px; }

    /* hide category tag on mobile list to keep it compact */
    .card-tags { display: none; }

    .visit-time { font-size: 10px; }
  }
</style>
</head>
<body>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-icon">👔</div>
  <div class="loading-text">正在載入店家資料…</div>
  <div class="loading-sub">從 Google Sheet 同步中</div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>
  <div class="loading-percent" id="loadingPercent">0%</div>
</div>

<header>
  <div class="header-inner">
    <div class="header-top">
      <div class="logo-icon">👔</div>
      <div>
        <h1>服飾<span>網購整理</span></h1>
        <div class="subtitle">按星等與價位整理的服飾購物清單</div>
      </div>
      <a href="editor.html" class="edit-link" id="editLink">✏️ 編輯清單</a>
    </div>
    <button class="filter-toggle" id="filterToggle" aria-expanded="false">
      <span class="filter-toggle-label">🔧 篩選條件</span>
      <span class="filter-active-badge" id="filterBadge"></span>
      <span class="filter-toggle-arrow">▼</span>
    </button>
    <div class="filter-collapse" id="filterCollapse">
      <div class="filter-bar">
        <div class="filter-group">
          <span class="filter-label">⭐ 星等</span>
          <div>
            <button class="filter-btn active" data-star="all">全部</button>
            <button class="filter-btn" data-star="5">★★★★★</button>
            <button class="filter-btn" data-star="4">★★★★</button>
            <button class="filter-btn" data-star="3">★★★</button>
            <button class="filter-btn" data-star="2">★★</button>
            <button class="filter-btn" data-star="1">★</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">💰 價位</span>
          <div>
            <button class="filter-btn active" data-price="all">全部</button>
            <button class="filter-btn" data-price="1">$ 平價</button>
            <button class="filter-btn" data-price="2">$$ 中等</button>
            <button class="filter-btn" data-price="3">$$$ 高端</button>
          </div>
        </div>
        <div class="filter-group">
          <span class="filter-label">🗂 類型</span>
          <div>
            <button class="filter-btn active" data-cat="all">全部</button>
            <button class="filter-btn" data-cat="台灣品牌">台灣品牌</button>
            <button class="filter-btn" data-cat="日系">日系</button>
            <button class="filter-btn" data-cat="韓系">韓系</button>
            <button class="filter-btn" data-cat="歐美">歐美</button>
          </div>
        </div>
        <div class="search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="search" placeholder="搜尋店家...">
        </div>
      </div>
    </div>
  </div>
</header>

<div class="stats-bar">
  <span class="stats-count">顯示 <span id="count">0</span> 家店舖</span>
</div>

<main>
  <div id="empty" class="empty-state">
    <div class="icon">🔍</div>
    <p>沒有符合條件的店家</p>
  </div>
  <div id="sections"></div>
</main>

<script>
const ADMIN_TOKEN_KEY = 'apparel_sheet_admin_token';
const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbxjk6If04-aFjhCjkbNkMBOyVkYAC4G1TUzdh4Bpan9xSVYhFEXlB1D8-HRtR7j8OW5zQ/exec';

// ── Visit tracking ──
const VISITS_COOKIE = 'apparel_visits';
const VISITS = loadVisits();

function saveVisit(url) {
  const visitedAt = Date.now();
  VISITS[visitKey(url)] = visitedAt;
  saveVisits();
}

function getAdminToken() {
  return localStorage.getItem(ADMIN_TOKEN_KEY) || '';
}

function promptAdminToken() {
  const current = getAdminToken();
  const token = prompt('請輸入 Google Sheet 管理密碼', current);
  if (!token) return '';
  localStorage.setItem(ADMIN_TOKEN_KEY, token);
  return token;
}

function loadVisits() {
  const cookieValue = readCookie(VISITS_COOKIE);
  if (cookieValue) {
    try {
      return JSON.parse(cookieValue);
    } catch {}
  }

  try {
    const legacy = JSON.parse(localStorage.getItem('apparel_visits') || '{}');
    const migrated = {};
    Object.entries(legacy).forEach(([url, ts]) => {
      if (Number(ts)) migrated[visitKey(url)] = Number(ts);
    });
    if (Object.keys(migrated).length) {
      writeCookie(VISITS_COOKIE, JSON.stringify(migrated), 365);
      return migrated;
    }
  } catch {}

  return {};
}

function saveVisits() {
  writeCookie(VISITS_COOKIE, JSON.stringify(VISITS), 365);
}

function readCookie(name) {
  const prefix = `${name}=`;
  const found = document.cookie
    .split(';')
    .map(part => part.trim())
    .find(part => part.startsWith(prefix));
  return found ? decodeURIComponent(found.slice(prefix.length)) : '';
}

function writeCookie(name, value, days) {
  const maxAge = days * 24 * 60 * 60;
  document.cookie = `${name}=${encodeURIComponent(value)}; max-age=${maxAge}; path=/; SameSite=Lax`;
}

function visitKey(url) {
  let hash = 0;
  for (let i = 0; i < url.length; i++) {
    hash = ((hash << 5) - hash + url.charCodeAt(i)) | 0;
  }
  return Math.abs(hash).toString(36);
}

function formatVisitTime(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return '剛剛';
  if (m < 60) return `${m} 分鐘前`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} 小時前`;
  const d = Math.floor(h / 24);
  if (d < 30) return `${d} 天前`;
  const dt = new Date(ts);
  return `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`;
}

// Update a single card's visit-time label without re-rendering
document.addEventListener('click', e => {
  const card = e.target.closest('a.card[data-url]');
  if (!card) return;
  const url = card.dataset.url;
  saveVisit(url);
  const el = card.querySelector('.visit-time');
  if (el) {
    el.textContent = '🕐 剛剛';
    el.classList.add('has-visit');
  }
});

document.getElementById('editLink').addEventListener('click', e => {
  e.preventDefault();
  const saved = getAdminToken();
  if (saved || promptAdminToken()) {
    window.location.href = e.currentTarget.href;
  }
});

let STORES = [];

async function loadStores() {
  try {
    const res = await fetch(`${SHEET_API_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    if (Array.isArray(data.stores) && data.stores.length) {
      return data.stores;
    }
    throw new Error('Google Sheet 回傳的資料為空');
  } catch (err) {
    console.error('載入店家資料失敗', err);
    throw err;
  }
}

// ── 進度條動畫控制 ──
function animateProgress(targetPercent, durationMs) {
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('loadingPercent');
  const startPercent = parseFloat(fill.style.width) || 0;
  const startTime = performance.now();

  return new Promise(resolve => {
    function step(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / durationMs, 1);
      // ease-out cubic
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = startPercent + (targetPercent - startPercent) * eased;
      fill.style.width = current + '%';
      label.textContent = Math.round(current) + '%';
      if (progress < 1) {
        requestAnimationFrame(step);
      } else {
        resolve();
      }
    }
    requestAnimationFrame(step);
  });
}

function hideLoadingOverlay() {
  const overlay = document.getElementById('loadingOverlay');
  overlay.classList.add('hidden');
  // 動畫結束後從 DOM 移除
  setTimeout(() => overlay.remove(), 600);
}

function showLoadingError() {
  const overlay = document.getElementById('loadingOverlay');
  overlay.querySelector('.loading-text').textContent = '載入失敗';
  overlay.querySelector('.loading-sub').textContent = '無法連線至 Google Sheet，請重新整理頁面';
  overlay.querySelector('.loading-icon').textContent = '⚠️';
  overlay.querySelector('.loading-icon').style.animation = 'none';
  const fill = document.getElementById('progressFill');
  fill.style.background = '#f87171';
}

const PRICE_LABELS = { 1: "$ 平價", 2: "$$ 中等", 3: "$$$ 高端" };
const PRICE_CLASS = { 1: "price-1", 2: "price-2", 3: "price-3" };

const SECTION_META = {
  5: { title: "★★★★★ 最愛首選", color: "#f5c542" },
  4: { title: "★★★★ 強力推薦", color: "#f5c542" },
  3: { title: "★★★ 值得一逛", color: "#f5c542" },
  2: { title: "★★ 偶爾參考", color: "#9090a8" },
  1: { title: "★ 備用清單", color: "#9090a8" },
  0: { title: "🗂 其他類別", color: "#a78bfa" },
};

let activeStars = new Set(["all"]);
let activePrices = new Set(["all"]);
let activeCats = new Set(["all"]);
let searchQ = "";

function getFaviconUrl(domain) {
  return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
}

function starsHtml(n) {
  let h = '<div class="stars">';
  for (let i = 1; i <= 5; i++) {
    h += `<span class="star ${i <= n ? 'filled' : ''}">★</span>`;
  }
  h += '</div>';
  return h;
}

function priceHtml(p) {
  if (!p) return '';
  return `<span class="price-badge ${PRICE_CLASS[p]}">${PRICE_LABELS[p]}</span>`;
}

function cardHtml(s) {
  const faviconUrl = getFaviconUrl(s.domain);
  const noteHtml = s.note ? `<span class="category-tag">🔥 ${s.note}</span>` : '';
  const catHtml = s.cat ? `<span class="category-tag">${s.cat}</span>` : '';
  const vt = VISITS[visitKey(s.url)];
  const vtText = vt ? `🕐 ${formatVisitTime(vt)}` : '';
  return `
    <a class="card" href="${s.url}" target="_blank" rel="noopener"
       data-stars="${s.stars}" data-price="${s.price}" data-cat="${s.cat}"
       data-name="${s.name.toLowerCase()}" data-url="${s.url}">
      <div class="card-thumb">
        <div class="brand-bg" style="background-image:url('${faviconUrl}')"></div>
        <img class="favicon" src="${faviconUrl}" alt="${s.name}"
             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2256%22 height=%2256%22><rect width=%2256%22 height=%2256%22 rx=%2212%22 fill=%22%23333%22/><text x=%2228%22 y=%2236%22 text-anchor=%22middle%22 font-size=%2224%22>👔</text></svg>'">
      </div>
      <div class="card-body">
        <div class="card-name" title="${s.name}">${s.name}</div>
        <div class="card-meta">
          ${starsHtml(s.stars)}
          ${priceHtml(s.price)}
        </div>
        <div class="card-tags" style="display:flex;gap:6px;flex-wrap:wrap;">${catHtml}${noteHtml}</div>
        <div class="visit-time ${vt ? 'has-visit' : ''}">${vtText}</div>
      </div>
    </a>`;
}

function renderSections() {
  // Group matching stores
  const groups = {};
  let total = 0;

  STORES.forEach(s => {
    const starMatch = activeStars.has("all") || activeStars.has(String(s.stars));
    const priceMatch = activePrices.has("all") || activePrices.has(String(s.price));
    const catMatch = activeCats.has("all") || activeCats.has(s.cat);
    const nameMatch = !searchQ || s.name.toLowerCase().includes(searchQ);

    const key = s.stars;
    if (!groups[key]) groups[key] = [];

    const card = document.querySelector(`a.card[data-name="${s.name.toLowerCase()}"]`);
    const visible = starMatch && priceMatch && catMatch && nameMatch;
    if (visible) {
      groups[key].push(s);
      total++;
    }
  });

  document.getElementById('count').textContent = total;
  document.getElementById('empty').classList.toggle('show', total === 0);

  const sectionsEl = document.getElementById('sections');
  sectionsEl.innerHTML = '';

  // Order: 5,4,3,2,1,0
  [5,4,3,2,1,0].forEach(stars => {
    const items = groups[stars];
    if (!items || items.length === 0) return;

    const meta = SECTION_META[stars];
    const block = document.createElement('div');
    block.className = 'section-block';
    block.innerHTML = `
      <div class="section-header">
        <h2>${meta.title}</h2>
        <span class="count-badge">${items.length} 家</span>
        <div class="section-divider"></div>
      </div>
      <div class="grid">${[...items].sort((a, b) => a.price - b.price || a.name.localeCompare(b.name, 'zh-TW')).map(cardHtml).join('')}</div>`;
    sectionsEl.appendChild(block);
  });
}

// ── Mobile filter toggle ──
const filterToggle = document.getElementById('filterToggle');
const filterCollapse = document.getElementById('filterCollapse');
const filterBadge = document.getElementById('filterBadge');

filterToggle.addEventListener('click', () => {
  const open = filterCollapse.classList.toggle('open');
  filterToggle.classList.toggle('open', open);
  filterToggle.setAttribute('aria-expanded', open);
});

function updateFilterBadge() {
  const active = (!activeStars.has('all') ? 1 : 0) +
                 (!activePrices.has('all') ? 1 : 0) +
                 (!activeCats.has('all') ? 1 : 0) +
                 (searchQ ? 1 : 0);
  filterBadge.textContent = active > 0 ? active : '';
  filterBadge.classList.toggle('show', active > 0);
  filterToggle.classList.toggle('has-filter', active > 0);
}

// ── Filter logic ──
document.querySelectorAll('[data-star]').forEach(btn => {
  btn.addEventListener('click', () => {
    const val = btn.dataset.star;
    if (val === 'all') {
      // 點「全部」→ 清除所有選擇，回到全部
      activeStars = new Set(['all']);
    } else {
      // 點星等按鈕 → 複選模式
      activeStars.delete('all');
      if (activeStars.has(val)) {
        activeStars.delete(val);
      } else {
        activeStars.add(val);
      }
      // 若全部取消選擇，自動回到「全部」
      if (activeStars.size === 0) activeStars = new Set(['all']);
    }
    // 更新按鈕樣式
    document.querySelectorAll('[data-star]').forEach(b => {
      b.classList.toggle('active', activeStars.has(b.dataset.star));
    });
    renderSections();
    updateFilterBadge();
  });
});

document.querySelectorAll('[data-price]').forEach(btn => {
  btn.addEventListener('click', () => {
    const val = btn.dataset.price;
    if (val === 'all') {
      activePrices = new Set(['all']);
    } else {
      activePrices.delete('all');
      activePrices.has(val) ? activePrices.delete(val) : activePrices.add(val);
      if (activePrices.size === 0) activePrices = new Set(['all']);
    }
    document.querySelectorAll('[data-price]').forEach(b => {
      b.classList.toggle('active', activePrices.has(b.dataset.price));
    });
    renderSections();
    updateFilterBadge();
  });
});

document.querySelectorAll('[data-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    const val = btn.dataset.cat;
    if (val === 'all') {
      activeCats = new Set(['all']);
    } else {
      activeCats.delete('all');
      activeCats.has(val) ? activeCats.delete(val) : activeCats.add(val);
      if (activeCats.size === 0) activeCats = new Set(['all']);
    }
    document.querySelectorAll('[data-cat]').forEach(b => {
      b.classList.toggle('active', activeCats.has(b.dataset.cat));
    });
    renderSections();
    updateFilterBadge();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.toLowerCase().trim();
  renderSections();
  updateFilterBadge();
});

// ── 初始化：先顯示載入動畫，等 Google Sheet 資料載入完再渲染 ──
(async function init() {
  // 階段 1：模擬連線中 (0% → 30%)
  const progressPromise = animateProgress(30, 600);

  try {
    // 同步啟動 fetch 和第一段動畫
    const fetchPromise = loadStores();
    await progressPromise;

    // 階段 2：等待資料回傳中 (30% → 70%)
    animateProgress(70, 1500);
    const stores = await fetchPromise;

    // 階段 3：渲染資料 (70% → 100%)
    await animateProgress(100, 300);
    STORES = stores;
    renderSections();

    // 短暫停留讓使用者看到 100%
    await new Promise(r => setTimeout(r, 200));
    hideLoadingOverlay();
  } catch (err) {
    showLoadingError();
  }
})();
</script>
